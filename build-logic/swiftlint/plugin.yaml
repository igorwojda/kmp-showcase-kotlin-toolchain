# - `./kotlin check swiftlint` - fails on rule violations (warnings included)
# - `./kotlin do swiftlintApply` - also fixes correctable violations in place
#
# The SwiftLint release set by `swiftlint` in libs.versions.toml is downloaded on first use, so no separate
# installation is required. To upgrade, change that version and the checksums below (`digest` of the assets at
# https://api.github.com/repos/realm/SwiftLint/releases/tags/<version>).
tasks:
  installSwiftLint:
    action: !com.igorwojda.showcase.buildlogic.swiftlint.installSwiftLint
      versionCatalog: ${project.rootDir}/libs.versions.toml
      versionAlias: swiftlint
      sha256:
        macos: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        linuxAmd64: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
        linuxArm64: 9ffa52f478e6d8eb485d37d14715ffac90abc81c58f3370d598bf75be05605f8
      installDir: ${taskOutputDir}

  swiftlintCheck:
    action: !com.igorwojda.showcase.buildlogic.swiftlint.swiftlint
      installDir: ${tasks.installSwiftLint.action.installDir}
      sourceDir: ${module.rootDir}/src
      config: ${project.rootDir}/.swiftlint.yml
      fix: false

  swiftlintApply:
    action: !com.igorwojda.showcase.buildlogic.swiftlint.swiftlint
      installDir: ${tasks.installSwiftLint.action.installDir}
      sourceDir: ${module.rootDir}/src
      config: ${project.rootDir}/.swiftlint.yml
      fix: true

checks:
  - name: swiftlint
    performedBy: swiftlintCheck

commands:
  - swiftlintApply
